<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="6" />
  
  <!-- Chef Hat & Knife Vector Graphic -->
  <g filter="url(#shadow)" transform="translate(40, 20)">
    <!-- Chef Hat Base -->
    <rect x="156" y="270" width="120" height="42" rx="10" fill="#ffffff" />
    <line x1="166" y1="285" x2="266" y2="285" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
    <line x1="166" y1="297" x2="266" y2="297" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
    
    <!-- Hat Top Plumes -->
    <path d="M 166 270 C 130 240 120 180 160 145 C 190 120 220 135 230 150 C 240 125 280 125 295 150 C 330 130 365 170 345 210 C 365 245 330 270 266 270 Z" fill="#ffffff" />
    <path d="M 185 270 C 170 220 180 180 200 160" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <path d="M 245 270 C 245 210 248 175 250 155" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <path d="M 285 270 C 295 230 295 190 280 170" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Golden Stars / Badges -->
  <path d="M 256 370 L 263 388 L 282 389 L 267 401 L 272 420 L 256 409 L 240 420 L 245 401 L 230 389 L 249 388 Z" fill="url(#goldGrad)" filter="url(#shadow)" />
  <path d="M 196 385 L 201 397 L 214 398 L 204 406 L 207 419 L 196 411 L 185 419 L 188 406 L 178 398 L 191 397 Z" fill="url(#goldGrad)" opacity="0.85" />
  <path d="M 316 385 L 321 397 L 334 398 L 324 406 L 327 419 L 316 411 L 305 419 L 308 406 L 298 398 L 311 397 Z" fill="url(#goldGrad)" opacity="0.85" />
  
  <!-- Text Label -->
  <text x="256" y="465" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" letter-spacing="4">G-CHEF PWA</text>
</svg>
